# TİGNAL API imajını monorepo kökünden derler.
# Kullanım:
#   gcloud builds submit --config apps/api/cloudbuild.yaml \
#     --substitutions _IMAGE=REGION-docker.pkg.dev/PROJECT/tignal/api:latest .
steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-f", "apps/api/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  machineType: "E2_HIGHCPU_8"
