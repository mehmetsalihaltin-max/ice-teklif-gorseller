# Lokal geliştirme için PostgreSQL. (Docker yoksa yerel kurulu PostgreSQL de kullanılabilir.)
services:
  db:
    image: postgres:16-alpine
    container_name: tignal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tignal
    ports:
      - "5432:5432"
    volumes:
      - tignal_pgdata:/var/lib/postgresql/data

volumes:
  tignal_pgdata:
